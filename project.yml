name: PhoneCam
options:
  bundleIdPrefix: com.phonecam
packages:
  PhoneCamCore:
    path: Core
targets:
  PhoneCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [PhoneCam]
    dependencies:
      - package: PhoneCamCore
    info:
      path: PhoneCam/Info.plist
      properties:
        NSBonjourServices: [_phonecam._tcp, _phonecam._udp]
        PhoneCamKey: $(PHONECAM_KEY)
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONECAM_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneCam
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is streamed to your Mac over the local network."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Your Mac connects to the camera over the local network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  PhoneCamMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [mac/PhoneCamMac]
    info:
      path: mac/PhoneCamMac/Info.plist
      properties:
        NSBonjourServices: [_phonecam._tcp, _phonecam._udp]
        PhoneCamKey: $(PHONECAM_KEY)
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    dependencies:
      - package: PhoneCamCore
      - target: PhoneCamCamera
        embed: true
    settings:
      base:
        PRODUCT_NAME: PhoneCam
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONECAM_BUNDLE_ID).mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: mac/PhoneCamMac/PhoneCamMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneCam
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PhoneCam connects to the PhoneCam app on your iPhone."
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"

  PhoneCamCamera:
    type: system-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: mac/CameraExtension
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: PhoneCamCore
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONECAM_BUNDLE_ID).mac.vcam
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: mac/CameraExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: mac/CameraExtension/CameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"

# Run and archive the optimized build: the Swift code on the hot paths (every UDP packet, every frame's
# measurements) is several times slower in Debug (Mac app ~14% CPU in Debug, ~1.5% in Release).
schemes:
  PhoneCam:
    build:
      targets:
        PhoneCam: all
    run:
      config: Release
    archive:
      config: Release
  PhoneCamMac:
    build:
      targets:
        PhoneCamMac: all
    run:
      config: Release
    archive:
      config: Release
